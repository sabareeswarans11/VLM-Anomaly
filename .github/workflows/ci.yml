name: CI

on:
  workflow_dispatch: # manual trigger only — re-add push/pull_request to re-enable

jobs:
  test:
    name: Lint + Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv --quiet

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: |
          pytest -m "not slow and not integration and not edge" \
            --cov=src/vlm_anomaly \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -q
        env:
          # Explicitly unset all API keys — tests must not need them
          TOGETHER_API_KEY: ""
          GEMINI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GROQ_API_KEY: ""
